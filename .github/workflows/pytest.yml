name: Test with pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          # The oldest versions pyproject.toml allows.
          - python-version: '3.10'
            packages: django==4.2.* django-environ==0.11.*
          - python-version: '3.13'
            packages: django==5.2.* django-environ
          - python-version: '3.14'
            packages: django django-environ

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1

      - run: poetry install --sync

      - run: poetry run -- pip install --upgrade --upgrade-strategy eager -- ${{ matrix.packages }}

      - run: poetry run pytest -W error

      - run: poetry run flake8
